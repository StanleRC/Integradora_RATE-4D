<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RETE - Detalle del Taller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/rete.css">
    <style>
        body { background: #f4f4f4; min-height: 100vh; }
        main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 48px; }
        .volver { display: inline-flex; align-items: center; gap: 6px; color: #111; text-decoration: none; font-size: 15px; margin-bottom: 14px; }
        .volver:hover { text-decoration: underline; }

        .detalle {
            position: relative;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,.3);
            padding: 26px 30px 30px;
            display: grid;
            grid-template-columns: minmax(260px, 340px) 1fr;
            gap: 56px;
        }

        /*Galería*/
        .principal { aspect-ratio: 1 / 1; background: linear-gradient(135deg, #0f7f8f, #0b3a63); overflow: hidden; }
        .principal img { width: 100%; height: 100%; object-fit: cover; display: block; }
        /* ----- Información ----- */
        .info { padding-top: 6px; }
        .info h2 { margin: 0 0 26px; font-size: clamp(30px, 4vw, 44px); line-height: 1.1; font-weight: 600; max-width: 420px; }
        .dato { margin: 0 0 18px; font-size: 20px; line-height: 1.25; max-width: 400px; }
        .dato b { font-weight: 700; }

        .botones { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 320px; margin-top: 8px; }
        .botones .btn { width: 100%; max-width: 224px; height: 42px; font-size: 15px; }

        .btn-fav-esquina {
            position: absolute; top: 12px; right: 16px;
            width: 36px; height: 36px; padding: 2px; border: 0; background: transparent; cursor: pointer;
        }
        .corazon { width: 100%; height: 100%; fill: none; stroke: #000; stroke-width: 2; }
        .btn .corazon { width: 22px; height: 22px; stroke: #fff; }
        .activo .corazon { fill: #e0245e; stroke: #e0245e; }
        .btn.activo .corazon { fill: #fff; stroke: #fff; }

        @media (max-width: 800px) {
            .detalle { grid-template-columns: 1fr; gap: 28px; }
            .botones { max-width: none; }
        }
    </style>
</head>
<body>

<header class="rete-header">
    <div class="logo-utez">
        <!-- Coloca aquí el logo de UTEZ (img/utez-logo.png)-->
        <img src="img/utez-logo.png" alt="UTEZ"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
        <span style="display:none;">UTEZ</span>
    </div>
    <h1>AbModel - Inscripción a talleres</h1>

    <button class="menu-btn" id="btn-menu" aria-label="Abrir menú" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <nav class="menu-nav" id="menu-nav" aria-label="Menú principal">
        <div class="menu-usuario">
            <strong id="menu-nombre">Julian Daniel Perez Perez</strong>
            <span id="menu-rol">Estudiante</span>
        </div>
        <ul>
            <li><a href="perfil.html">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
                Mi perfil</a></li>
            <li><a href="catalogo.html">
                <svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2zM12 6v14"/></svg>
                Talleres Existentes</a></li>
            <li><a href="inscripciones.html">
                <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
                Mis talleres</a></li>
            <li><a href="guardados.html">
                <svg viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></svg>
                Talleres guardados</a></li>
        </ul>
        <div class="menu-salir-wrap">
            <button type="button" class="menu-salir" onclick="cerrarSesion()">
                <svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>
                Cerrar sesión
            </button>
        </div>
    </nav>
</header>

<main>
    <a class="volver" href="catalogo.html" id="btn-anterior">← Anterior</a>

    <!-- LÓGICA: el id del taller puede venir en la URL, ej. detalle-taller.html?id=3 -->
    <article class="detalle" id="detalle-taller" data-id-taller="">

        <button class="btn-fav-esquina" id="btn-favorito" aria-label="Guardar taller" onclick="alternarFavorito()">
            <svg class="corazon" viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></svg>
        </button>

        <!--Galería-->
        <section class="galeria">
            <div class="principal">
                <img id="taller-imagen" alt="Imagen del taller"
                     onerror="this.style.display='none'">
            </div>
        </section>

        <!--Información-->
        <section class="info">
            <h2 id="taller-nombre">Cargando taller...</h2>

            <p class="dato"><b>Instructor:</b> <span id="taller-instructor"></span></p>
            <p class="dato"><b>Descripción:</b> <span id="taller-descripcion"></span></p>
            <p class="dato"><b>Horario:</b> <span id="taller-horario"></span></p>
            <p class="dato"><b>Aula:</b> <span id="taller-aula"></span></p>
            <p class="dato" id="taller-cupos"></p>
            <p class="dato" id="mensaje-taller" role="status" aria-live="polite"></p>

            <div class="botones">
                <button class="btn btn-primario" id="btn-inscribirse" onclick="inscribirse()" disabled>Inscribirse ahora</button>
                <button class="btn btn-secundario" id="btn-guardar" onclick="alternarFavorito()">
                    <svg class="corazon" viewBox="0 0 24 24"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></svg>
                    Guardar taller
                </button>
            </div>
        </section>
    </article>
</main>

<!--Ventana: Confirmación de registro-->
<dialog class="modal" id="modal-confirmacion" aria-labelledby="modal-titulo">
    <form class="modal-caja" id="form-confirmacion" onsubmit="confirmarInscripcion(event)" novalidate>
        <h2 class="modal-titulo" id="modal-titulo">Confirmación de registro</h2>

        <p id="confirmacion-texto"></p>
        <p class="modal-error" id="confirmacion-error" role="alert" hidden></p>

        <div class="modal-acciones">
            <button type="button" class="btn btn-secundario" id="btn-cancelar" onclick="cerrarConfirmacion()">Cancelar</button>
            <button type="submit" class="btn btn-primario" id="btn-confirmar">Inscribirme</button>
        </div>
    </form>
</dialog>


<script src="js/rete.js"></script>
<script>

    const modal = document.getElementById('modal-confirmacion');
    const botonInscribirse = document.getElementById('btn-inscribirse');
    const botonConfirmar = document.getElementById('btn-confirmar');
    const mensajeTaller = document.getElementById('mensaje-taller');
    const errorConfirmacion = document.getElementById('confirmacion-error');
    const idTaller = Number(new URLSearchParams(window.location.search).get('id'));

    function inscribirse() {
        const usuario = obtenerUsuario();
        if (!usuario || !usuario.idEstudiante) {
            alert('Primero inicia sesión como alumno para inscribirte.');
            window.location.href = 'index.html';
            return;
        }

        if (botonInscribirse.disabled) return;
        errorConfirmacion.hidden = true;
        document.getElementById('confirmacion-texto').textContent =
            `¿Deseas inscribirte en "${document.getElementById('taller-nombre').textContent}"?`;
        modal.showModal();
        botonConfirmar.focus();
    }

    function cerrarConfirmacion() {
        modal.close();
        errorConfirmacion.hidden = true;
    }

    async function confirmarInscripcion(e) {
        e.preventDefault();
        const usuario = obtenerUsuario();
        if (!usuario || !usuario.idEstudiante) {
            cerrarConfirmacion();
            alert('Tu sesión no es válida. Inicia sesión nuevamente.');
            window.location.href = 'index.html';
            return;
        }

        botonConfirmar.disabled = true;
        botonConfirmar.textContent = 'Inscribiendo...';
        errorConfirmacion.hidden = true;

        try {
            const params = new URLSearchParams({
                idEstudiante: usuario.idEstudiante,
                idTaller
            });
            const respuesta = await fetch(`/api/talleres/inscribir?${params}`, { method: 'POST' });
            const datos = await respuesta.json();
            if (!respuesta.ok) {
                throw new Error(datos.mensaje || `Error del servidor (${respuesta.status})`);
            }
            if (!datos.mensaje || !datos.mensaje.startsWith('OK')) {
                errorConfirmacion.textContent = datos.mensaje || 'No se pudo completar la inscripción.';
                errorConfirmacion.hidden = false;
                return;
            }

            cerrarConfirmacion();
            alert(datos.mensaje);
            window.location.href = 'catalogo.html';
        } catch (error) {
            errorConfirmacion.textContent = error.message || 'No se pudo completar la inscripción.';
            errorConfirmacion.hidden = false;
        } finally {
            botonConfirmar.disabled = false;
            botonConfirmar.textContent = 'Inscribirme';
        }
    }

    function obtenerUsuario() {
        try {
            return JSON.parse(sessionStorage.getItem('usuario') || 'null');
        } catch {
            return null;
        }
    }

    async function cargarTaller() {
        if (!Number.isSafeInteger(idTaller) || idTaller < 1) {
            mostrarErrorTaller('No se indicó un taller válido.');
            return;
        }

        try {
            const respuesta = await fetch('/api/talleres');
            if (!respuesta.ok) {
                throw new Error(`Error del servidor (${respuesta.status})`);
            }
            const talleres = await respuesta.json();
            const taller = talleres.find(item => Number(item.idTaller) === idTaller);
            if (!taller) {
                mostrarErrorTaller('El taller no existe o ya no está disponible.');
                return;
            }

            document.getElementById('detalle-taller').dataset.idTaller = taller.idTaller;
            document.getElementById('taller-nombre').textContent = taller.nombreTaller || 'Taller';
            document.getElementById('taller-instructor').textContent = taller.instructor || 'Por asignar';
            document.getElementById('taller-descripcion').textContent = taller.descripcion || 'Sin descripción.';
            document.getElementById('taller-horario').textContent =
                `${taller.dia || 'Día por definir'} de ${taller.horaInicio || '--:--'} a ${taller.horaFin || '--:--'}`;
            document.getElementById('taller-aula').textContent = taller.aula || 'Por asignar';

            const disponibles = Math.max(0, Number(taller.cupoMaximo) - Number(taller.inscritosActuales));
            const cupos = document.getElementById('taller-cupos');
            cupos.textContent = disponibles > 0
                ? `Quedan ${disponibles} ${disponibles === 1 ? 'lugar disponible' : 'lugares disponibles'}.`
                : 'Cupo lleno.';

            const imagen = document.getElementById('taller-imagen');
            if (taller.imagen) {
                imagen.src = taller.imagen;
                imagen.alt = `Imagen del taller ${taller.nombreTaller}`;
                imagen.style.display = '';
            } else {
                imagen.style.display = 'none';
            }

            botonInscribirse.disabled = disponibles === 0;
        } catch (error) {
            mostrarErrorTaller(error.message || 'No se pudo cargar el taller.');
        }
    }

    function mostrarErrorTaller(mensaje) {
        document.getElementById('taller-nombre').textContent = 'No se pudo cargar el taller';
        mensajeTaller.textContent = mensaje;
        botonInscribirse.disabled = true;
    }

    function alternarFavorito() {
        // Solo interfaz por ahora; TODO: guardar/quitar el taller en el backend.
        document.getElementById('btn-favorito').classList.toggle('activo');
        document.getElementById('btn-guardar').classList.toggle('activo');
    }

    cargarTaller();
</script>
</body>
</html>
